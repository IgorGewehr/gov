<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tensorroot.Gov — Painel de Progresso</title>
<style>
  :root{
    --navy:#071d41; --blue:#1351b4; --blue2:#2670e8; --green:#168821; --yellow:#dba000;
    --gray:#8d99ae; --bg:#eef2f7; --card:#ffffff; --ink:#1c2733; --muted:#5a6b7b; --line:#dde3ea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
  a{color:var(--blue)}
  header{background:linear-gradient(135deg,var(--navy),#0a2a5e);color:#fff;padding:22px 28px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{width:42px;height:42px;border-radius:10px;background:#fff;color:var(--navy);font-weight:800;font-size:20px;display:grid;place-items:center}
  h1{font-size:20px;margin:0;font-weight:700}
  .sub{color:#bcd0ee;font-size:13px;margin-top:2px}
  .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:#bcd0ee}
  .dot{width:9px;height:9px;border-radius:50%;background:#26d07c;box-shadow:0 0 0 0 rgba(38,208,124,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(38,208,124,.6)}70%{box-shadow:0 0 0 9px rgba(38,208,124,0)}100%{box-shadow:0 0 0 0 rgba(38,208,124,0)}}
  .bar{margin-top:16px;height:12px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#26d07c,#7be3b0);width:0;transition:width .8s ease}
  .barlabel{margin-top:7px;font-size:13px;color:#dce7f7;display:flex;justify-content:space-between}
  main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
  .banner{background:#e8f1ff;border:1px solid #bcd6ff;border-left:5px solid var(--blue);border-radius:10px;padding:14px 16px;margin:18px 0;font-size:14px}
  .banner b{color:var(--navy)}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 26px}
  .metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .metric .v{font-size:22px;font-weight:800;color:var(--navy)}
  .metric .l{font-size:12.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.03em}
  .metric.verde .v{color:var(--green)} .metric.azul .v{color:var(--blue)}
  .sectitle{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:26px 0 12px}
  .marco{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;border-left:6px solid var(--gray)}
  .marco.done{border-left-color:var(--green)} .marco.active{border-left-color:var(--blue)}
  .mhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mid{font-weight:800;color:var(--navy);font-size:15px;min-width:34px}
  .mtitle{font-weight:700;font-size:15px;flex:1;min-width:200px}
  .badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .badge.done{background:#e3f5e9;color:var(--green)} .badge.active{background:#e3edff;color:var(--blue)} .badge.pending{background:#eef1f4;color:var(--muted)}
  .flag{font-size:10.5px;font-weight:700;color:#8a6d00;background:#fff4d6;border:1px solid #f0dea0;padding:2px 7px;border-radius:6px}
  .mnote{font-size:13px;color:var(--muted);margin:8px 0 0}
  .wfs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .wf{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#fbfcfe;display:flex;align-items:center;gap:6px;max-width:100%}
  .wf .s{width:8px;height:8px;border-radius:50%;background:var(--gray);flex:none}
  .wf.done .s{background:var(--green)} .wf.active .s{background:var(--blue);animation:pulse 1.8s infinite}
  .wf .id{font-weight:700;color:var(--muted)}
  .wf.done{border-color:#bfe6cb} .wf.active{border-color:#bcd6ff;background:#f3f8ff}
  .docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .doc{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--navy);font-weight:600;font-size:14px}
  .doc:hover{border-color:var(--blue);background:#f6f9ff}
  .doc small{display:block;color:var(--muted);font-weight:400;margin-top:3px;font-size:12px;word-break:break-all}
  footer{max-width:1100px;margin:0 auto;padding:0 18px 40px;color:var(--muted);font-size:12.5px}
  .err{background:#fde8e8;border:1px solid #f5b5b5;color:#9b1c1c;padding:10px 14px;border-radius:8px;margin:16px 0;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">TG</div>
    <div>
      <h1 id="produto">Tensorroot.Gov</h1>
      <div class="sub" id="subtitulo">Painel de Progresso</div>
    </div>
    <div class="live"><span class="dot"></span><span id="liveTxt">ao vivo</span></div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="barlabel"><span id="barPct">—</span><span id="atualizado">—</span></div>
</header>

<main>
  <div id="erro" class="err" style="display:none"></div>
  <div class="banner" id="banner">Carregando…</div>

  <div class="metrics" id="metrics"></div>

  <div class="sectitle">Marcos &amp; Workflows</div>
  <div id="marcos"></div>

  <div class="sectitle">Documentos do plano</div>
  <div class="docs" id="docs"></div>
</main>

<footer>
  Painel local · atualiza automaticamente a cada 15s · gerado por Claude Code enquanto executa os workflows.
  <span id="loadedAt"></span>
</footer>

<script>
const SCLASS = s => (s==='done'?'done':s==='active'?'active':'pending');
const SLABEL = s => (s==='done'?'Concluído':s==='active'?'Em execução':'Pendente');

function render(d){
  document.getElementById('erro').style.display='none';
  document.getElementById('produto').textContent = d.produto || 'Tensorroot.Gov';
  document.getElementById('subtitulo').textContent = d.subtitulo || '';
  document.getElementById('atualizado').textContent = 'Atualizado: ' + (d.atualizadoEm || '—');
  document.getElementById('banner').innerHTML = '<b>Atividade atual:</b> ' + (d.atividadeAtual || '—');

  // progresso geral (por workflows)
  let total=0, done=0, active=0;
  (d.marcos||[]).forEach(m => (m.workflows||[]).forEach(w => { total++; if(w.s==='done')done++; else if(w.s==='active')active++; }));
  const pct = total ? Math.round((done + active*0.4)/total*100) : 0;
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('barPct').textContent = pct + '% · ' + done + '/' + total + ' workflows concluídos';

  // métricas
  document.getElementById('metrics').innerHTML = (d.metricas||[]).map(m =>
    `<div class="metric ${m.cor||''}"><div class="v">${m.valor}</div><div class="l">${m.label}</div></div>`).join('');

  // marcos
  document.getElementById('marcos').innerHTML = (d.marcos||[]).map(m => {
    const wfs = (m.workflows||[]).map(w =>
      `<span class="wf ${SCLASS(w.s)}"><span class="s"></span><span class="id">${w.id}</span> ${w.t}</span>`).join('');
    return `<div class="marco ${SCLASS(m.status)}">
      <div class="mhead">
        <span class="mid">${m.id}</span>
        <span class="mtitle">${m.titulo}</span>
        ${m.flag?`<span class="flag">${m.flag}</span>`:''}
        <span class="badge ${SCLASS(m.status)}">${SLABEL(m.status)}</span>
      </div>
      ${m.nota?`<div class="mnote">${m.nota}</div>`:''}
      <div class="wfs">${wfs}</div>
    </div>`;
  }).join('');

  // docs
  document.getElementById('docs').innerHTML = (d.docs||[]).map(x =>
    `<a class="doc" href="${x.p}" target="_blank">${x.t}<small>${x.p.replace('../','docs/')}</small></a>`).join('');

  const now = new Date();
  document.getElementById('loadedAt').textContent = ' · carregado ' + now.toLocaleTimeString('pt-BR');
}

async function load(){
  try{
    const r = await fetch('progresso.json?t=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  }catch(e){
    const el = document.getElementById('erro');
    el.style.display='block';
    el.textContent = 'Não foi possível carregar progresso.json (' + e.message + '). Sirva esta pasta via HTTP.';
  }
}
load();
setInterval(load, 15000);
</script>
</body>
</html>

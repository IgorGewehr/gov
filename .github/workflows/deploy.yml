name: Deploy (Azure)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-tensorroot-gov
  DOTNET_VERSION: "8.0.x"

jobs:
  build:
    name: Publicar ApiHost
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        run: dotnet publish src/ApiHost/Tensorroot.Gov.ApiHost.csproj --configuration Release --output ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: apihost
          path: ./publish

  provision:
    name: Provisionar infraestrutura (Bicep)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy do Bicep (App Service + SQL + Blob + Key Vault)
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            sqlAdminLogin=${{ secrets.SQL_ADMIN_LOGIN }}
            sqlAdminSenha=${{ secrets.SQL_ADMIN_PASSWORD }}

  deploy:
    name: Deploy do App Service
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apihost
          path: ./publish
      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy para o Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./publish
